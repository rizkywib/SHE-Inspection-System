<VirtualHost *:82>
    ServerName eoblas10.ecogreenoleo.co.id

    # Adjust this path only if the application is deployed elsewhere.
    DocumentRoot /var/www/she-inspection-system/backend/she-api/public

    <Directory /var/www/she-inspection-system/backend/she-api/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/she-inspection-error.log
    CustomLog ${APACHE_LOG_DIR}/she-inspection-access.log combined
</VirtualHost>
